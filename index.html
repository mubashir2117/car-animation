<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Car Animation</title>
<style>
  :root{
    --sky-top:#0a1128;
    --sky-mid:#3a1a5c;
    --sky-glow:#ff5e3a;
    --accent-blue:#2f80ff;
    --accent-violet:#8a4dff;
    --panel-bg:rgba(20,22,45,0.55);
    --panel-border:rgba(255,255,255,0.12);
    --text:#f4f6ff;
    --text-dim:#aab0cf;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#05060f;
    overflow:hidden;
  }

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    overflow:hidden;
  }

  /* ---------- SKY ---------- */
  .sky{
    position:absolute;
    inset:0;
    background:linear-gradient(
      to bottom,
      #0a1128 0%,
      #241247 30%,
      #5b1e5e 52%,
      #b8355f 68%,
      #ff7a3d 82%,
      #ffb35c 92%
    );
    transition:filter .6s ease;
  }
  body.day .sky{
    background:linear-gradient(to bottom, #6db6ff 0%, #a8d8ff 40%, #dff3ff 70%, #ffe9c7 100%);
  }

  .stars{position:absolute;inset:0;}
  .stars span{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 3s ease-in-out infinite;
  }
  body.day .stars{display:none;}
  @keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
  }

  /* ---------- CLOUDS ---------- */
  .clouds{position:absolute;inset:0;pointer-events:none;}
  .cloud{
    position:absolute;
    opacity:.55;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));
    animation:driftCloud linear infinite;
  }
  @keyframes driftCloud{
    0%{transform:translateX(-260px);}
    100%{transform:translateX(calc(100vw + 260px));}
  }

  /* ---------- PLANE ---------- */
  .aero{
    position:absolute;
    top:16%;
    left:-14%;
    width:170px;
    z-index:3;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
    animation:fly 16s linear infinite;
  }
  .aero svg{width:100%;display:block;}
  .trail{
    position:absolute;
    top:50%;
    right:100%;
    width:220px;
    height:2px;
    background:linear-gradient(to left, rgba(255,255,255,.6), transparent);
    transform:translateY(-50%);
  }
  @keyframes fly{
    0%{ left:-14%; top:16%; transform:scale(1);}
    50%{ left:52%; top:11%; transform:scale(1.08);}
    100%{ left:118%; top:16%; transform:scale(1);}
  }

  /* ---------- CITY ---------- */
  .city-wrap{
    position:absolute;
    left:0; right:0;
    bottom:120px;
    height:220px;
    overflow:hidden;
    z-index:1;
  }
  .city{
    position:absolute;
    bottom:0; left:0;
    height:100%;
    width:200%;
    display:flex;
    align-items:flex-end;
    animation:cityScroll linear infinite;
  }
  .city svg{height:100%;width:auto;flex-shrink:0;}
  @keyframes cityScroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  /* ---------- ROAD ---------- */
  .road-wrap{
    position:absolute;
    left:0; right:0; bottom:0;
    height:120px;
    background:linear-gradient(to bottom, #14141c, #05050a);
    z-index:2;
    box-shadow: inset 0 30px 50px rgba(0,0,0,.6);
    border-top:2px solid rgba(255,255,255,.06);
  }
  .lane{
    position:absolute;
    top:50%;
    left:0;
    width:200%;
    height:6px;
    transform:translateY(-50%);
    display:flex;
    gap:40px;
    animation:laneMove linear infinite;
  }
  .lane span{
    width:60px;height:100%;
    background:#e8e8e8;
    opacity:.85;
    border-radius:3px;
    flex-shrink:0;
  }
  @keyframes laneMove{
    0%{transform:translateX(0) translateY(-50%);}
    100%{transform:translateX(-400px) translateY(-50%);}
  }
  .curb{
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:repeating-linear-gradient(90deg,#ffcf3f 0 30px, transparent 30px 60px);
    opacity:.5;
  }

  /* ---------- CAR ---------- */
  .car-stage{
    position:absolute;
    left:50%;
    bottom:88px;
    transform:translateX(-50%);
    z-index:5;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .car-body{
    animation:bounce 1s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3px);}
  }
  .wheel{ transform-box:fill-box; transform-origin:50% 50%; animation:spin .6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  body.paused .car-body,
  body.paused .wheel,
  body.paused .city,
  body.paused .lane,
  body.paused .aero,
  body.paused .cloud{
    animation-play-state:paused;
  }

  /* ---------- HEADER ---------- */
  .header{
    position:absolute;
    top:36px; left:0; right:0;
    text-align:center;
    z-index:10;
  }
  h1{
    font-size:clamp(32px,5vw,58px);
    font-weight:800;
    letter-spacing:-1px;
    background:linear-gradient(90deg,#ffffff 0%, #7fd6ff 45%, #a06bff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(120,150,255,.25);
  }
  .subtitle{
    margin-top:8px;
    font-size:15px;
    color:var(--text-dim);
    letter-spacing:.3px;
  }

  /* ---------- CONTROLS PANEL ---------- */
  .panel{
    position:absolute;
    top:150px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(14px);
    border-radius:18px;
    padding:16px 26px;
    display:flex;
    align-items:center;
    gap:26px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .btn-group{display:flex;gap:10px;}
  .btn{
    border:none;
    cursor:pointer;
    padding:10px 18px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    display:flex;
    align-items:center;
    gap:6px;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .btn:active{transform:translateY(0);}
  .btn-start{background:linear-gradient(135deg,#2f80ff,#1e5fd6);}
  .btn-pause{background:linear-gradient(135deg,#3a8bff,#2761c9);}
  .btn-reset{background:linear-gradient(135deg,#9b5cff,#6f2fe0);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}

  .divider{width:1px;height:34px;background:rgba(255,255,255,.15);}

  .speed-ctrl{display:flex;flex-direction:column;gap:6px;}
  .speed-ctrl label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
  .speed-row{display:flex;align-items:center;gap:10px;}
  input[type=range]{
    -webkit-appearance:none;
    width:150px;height:4px;
    background:rgba(255,255,255,.25);
    border-radius:3px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:#7fc8ff;
    box-shadow:0 0 8px rgba(127,200,255,.8);
    cursor:pointer;
    border:2px solid #fff;
  }

  .icon-group{display:flex;gap:8px;}
  .icon-btn{
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#fff;
    transition:background .15s ease, transform .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.active{background:#2f80ff;}

  /* ---------- STATS BAR ---------- */
  .stats{
    position:absolute;
    bottom:26px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(14px);
    border-radius:16px;
    padding:14px 30px;
    display:flex;
    gap:34px;
  }
  .stat{display:flex;align-items:center;gap:10px;}
  .stat .icon{
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
    color:#7fc8ff;
  }
  .stat .icon svg{width:16px;height:16px;}
  .stat-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);}
  .stat-value{font-size:16px;font-weight:700;color:#fff;}

  @media (max-width:640px){
    .panel{flex-wrap:wrap;justify-content:center;padding:14px 16px;top:130px;gap:14px;}
    .divider{display:none;}
    .stats{gap:18px;padding:12px 18px;}
    .header{top:20px;}
    h1{font-size:26px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="sky"></div>
  <div class="stars" id="stars"></div>

  <div class="clouds" id="clouds"></div>

  <div class="aero" style="animation-duration:16s;">
    <svg viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="planeBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="55%" stop-color="#dbe4f0"/>
          <stop offset="100%" stop-color="#a9b6cc"/>
        </linearGradient>
        <linearGradient id="planeStripe" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff8a3d"/>
          <stop offset="100%" stop-color="#ff3d6a"/>
        </linearGradient>
        <linearGradient id="planeTail" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3d6bff"/>
          <stop offset="100%" stop-color="#1c3aa8"/>
        </linearGradient>
      </defs>

      <!-- lower wing (near side, swept back-down) -->
      <path d="M118 52 L98 78 L114 76 L134 54 Z" fill="url(#planeBody)" stroke="#8b98b4" stroke-width="1"/>
      <!-- engine under wing -->
      <ellipse cx="112" cy="66" rx="7" ry="4" fill="#3a4257"/>
      <ellipse cx="112" cy="66" rx="3" ry="2" fill="#0e1420"/>

      <!-- fuselage (tail at left, nose points right) -->
      <path d="M22 44
               C22 32 40 25 60 24
               L150 22
               C172 22 186 28 200 40
               L208 44
               L200 48
               C186 58 172 63 150 63
               L60 61
               C40 60 22 55 22 44 Z"
            fill="url(#planeBody)" stroke="#8b98b4" stroke-width="1.2"/>

      <!-- nose tip highlight -->
      <path d="M200 40 L208 44 L200 48 C204 46 204 42 200 40 Z" fill="#eef2f8"/>

      <!-- tail fin (vertical stabilizer at the rear) -->
      <path d="M30 26 C32 14 40 5 48 3 L46 26 Z" fill="url(#planeTail)"/>
      <!-- small tail fin accent stripe -->
      <path d="M38 12 L45 6 L45 26 L40 26 Z" fill="url(#planeStripe)" opacity=".85"/>

      <!-- rear stabilizer (small horizontal fin near tail) -->
      <path d="M34 44 L18 38 L18 50 L34 48 Z" fill="url(#planeBody)" stroke="#8b98b4" stroke-width="1"/>

      <!-- cockpit window -->
      <path d="M172 30 C182 31 190 34 196 39 L188 41 C180 37 176 34 170 33 Z" fill="#1f2a3d"/>

      <!-- livery stripe along the body -->
      <path d="M28 48 L192 44 L196 47 L30 51 Z" fill="url(#planeStripe)"/>

      <!-- passenger windows -->
      <g fill="#274064">
        <circle cx="70" cy="41" r="1.4"/>
        <circle cx="80" cy="40.5" r="1.4"/>
        <circle cx="90" cy="40" r="1.4"/>
        <circle cx="100" cy="39.5" r="1.4"/>
        <circle cx="110" cy="39" r="1.4"/>
        <circle cx="120" cy="38.5" r="1.4"/>
        <circle cx="130" cy="38" r="1.4"/>
        <circle cx="140" cy="37.5" r="1.4"/>
        <circle cx="150" cy="37" r="1.4"/>
        <circle cx="160" cy="36.5" r="1.4"/>
      </g>

      <!-- upper wing (far side, peeking above fuselage) -->
      <path d="M122 34 L108 10 L122 12 L138 36 Z" fill="url(#planeBody)" stroke="#8b98b4" stroke-width="1" opacity=".9"/>
    </svg>
    <div class="trail"></div>
  </div>

  <div class="header">
    <h1>Running Car Animation</h1>
    <div class="subtitle">Beautiful CSS Animation Demo with Smooth Motion Effects</div>
  </div>

  <div class="panel">
    <div class="btn-group">
      <button class="btn btn-start" id="startBtn">▶ Start</button>
      <button class="btn btn-pause" id="pauseBtn" disabled>❚❚ Pause</button>
      <button class="btn btn-reset" id="resetBtn">⟲ Reset</button>
    </div>
    <div class="divider"></div>
    <div class="speed-ctrl">
      <label>Speed</label>
      <div class="speed-row">
        <input type="range" id="speedSlider" min="20" max="180" value="80">
      </div>
    </div>
    <div class="divider"></div>
    <div class="icon-group">
      <div class="icon-btn" id="nightToggle" title="Toggle day/night">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </div>
      <div class="icon-btn" id="musicToggle" title="Toggle sound">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" stroke="currentColor" fill="none" stroke-width="1.6"/></svg>
      </div>
      <div class="icon-btn" id="fullscreenToggle" title="Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
      </div>
    </div>
  </div>

  <div class="city-wrap">
    <div class="city" id="city" style="animation-duration:22s;">
      <!-- duplicated skyline for seamless loop, injected by JS -->
    </div>
  </div>

  <div class="road-wrap">
    <div class="curb"></div>
    <div class="lane" id="lane" style="animation-duration:.9s;">
      <!-- dashes injected -->
    </div>
  </div>

  <div class="car-stage">
    <svg class="car-body" width="380" height="130" viewBox="0 0 380 130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="carPaint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff6a5c"/>
          <stop offset="35%" stop-color="#e8283f"/>
          <stop offset="100%" stop-color="#8c0f22"/>
        </linearGradient>
        <linearGradient id="carPaintShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="carGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a4c72"/>
          <stop offset="100%" stop-color="#12172a"/>
        </linearGradient>
        <radialGradient id="rimGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#fdfdfd"/>
          <stop offset="100%" stop-color="#b9bfcc"/>
        </radialGradient>
      </defs>
      <ellipse cx="190" cy="118" rx="150" ry="10" fill="rgba(0,0,0,0.35)"/>
      <!-- body -->
      <path d="M35 92
               C30 75 45 62 70 58
               L95 40 C110 28 135 22 165 22
               L235 22 C255 22 268 30 278 42
               L300 58
               C325 60 345 68 352 84
               C356 92 352 98 342 98
               L330 98
               C330 84 318 74 305 74
               C292 74 280 84 280 98
               L120 98
               C120 84 108 74 95 74
               C82 74 70 84 70 98
               L48 98
               C38 98 33 96 35 92 Z"
            fill="url(#carPaint)" stroke="#5c0813" stroke-width="1.5"/>
      <!-- roof/hood shine -->
      <path d="M97 41 C112 29 136 23 165 23 L200 23 L185 55 L100 58 Z" fill="url(#carPaintShine)" opacity="0.7"/>
      <!-- windshield / windows -->
      <path d="M108 58 C118 40 138 30 165 28 L165 58 Z" fill="url(#carGlass)"/>
      <path d="M172 28 L232 28 C246 28 258 34 266 44 L266 58 L172 58 Z" fill="url(#carGlass)"/>
      <!-- door line -->
      <path d="M170 58 L170 98" stroke="#5c0813" stroke-width="1.2"/>
      <!-- headlight / taillight -->
      <circle cx="345" cy="66" r="5" fill="#ffe9a8"/>
      <rect x="36" y="62" width="10" height="6" rx="2" fill="#ff5c5c"/>
      <!-- side accent stripe -->
      <path d="M70 88 L330 88" stroke="#ffd447" stroke-width="2.5" opacity=".85"/>
      <!-- front bumper -->
      <path d="M340 84 C348 84 352 90 348 96 L332 96 L332 84 Z" fill="#6d0a17"/>
      <!-- MJ door branding -->
      <text x="205" y="79" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
            font-weight="800" font-size="22" letter-spacing="1"
            fill="#ffffff" stroke="#5c0813" stroke-width="0.6"
            style="paint-order:stroke fill;">MJ</text>

      <!-- back wheel -->
      <g transform="translate(95,98)">
        <circle r="26" fill="#111318"/>
        <circle r="26" fill="none" stroke="#333" stroke-width="2"/>
        <g class="wheel">
          <circle r="15" fill="url(#rimGrad)"/>
          <circle r="4.5" fill="#5c0813"/>
          <g stroke="#7d8296" stroke-width="2.2">
            <line x1="0" y1="-13" x2="0" y2="13"/>
            <line x1="-13" y1="0" x2="13" y2="0"/>
            <line x1="-9" y1="-9" x2="9" y2="9"/>
            <line x1="-9" y1="9" x2="9" y2="-9"/>
          </g>
        </g>
      </g>
      <!-- front wheel -->
      <g transform="translate(305,98)">
        <circle r="26" fill="#111318"/>
        <circle r="26" fill="none" stroke="#333" stroke-width="2"/>
        <g class="wheel">
          <circle r="15" fill="url(#rimGrad)"/>
          <circle r="4.5" fill="#5c0813"/>
          <g stroke="#7d8296" stroke-width="2.2">
            <line x1="0" y1="-13" x2="0" y2="13"/>
            <line x1="-13" y1="0" x2="13" y2="0"/>
            <line x1="-9" y1="-9" x2="9" y2="9"/>
            <line x1="-9" y1="9" x2="9" y2="-9"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M12 12l4-4M12 12v-6"/></svg></div>
      <div>
        <div class="stat-label">Speed</div>
        <div class="stat-value"><span id="speedVal">80</span> km/h</div>
      </div>
    </div>
    <div class="stat">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20l7-16 7 16M6 14h8"/></svg></div>
      <div>
        <div class="stat-label">Distance</div>
        <div class="stat-value"><span id="distVal">0.00</span> km</div>
      </div>
    </div>
    <div class="stat">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
      <div>
        <div class="stat-label">Time</div>
        <div class="stat-value"><span id="timeVal">00:00</span></div>
      </div>
    </div>
  </div>

</div>

<script>
  // stars
  const starsEl = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*55+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  // clouds
  const cloudsEl = document.getElementById('clouds');
  function cloudSVG(w){
    return `<svg viewBox="0 0 200 80" width="${w}" xmlns="http://www.w3.org/2000/svg">
      <g fill="#ffffff">
        <ellipse cx="60" cy="50" rx="50" ry="26"/>
        <ellipse cx="110" cy="38" rx="40" ry="30"/>
        <ellipse cx="150" cy="52" rx="36" ry="22"/>
      </g>
    </svg>`;
  }
  const cloudCfg = [
    {top:'8%', w:150, dur:46, delay:0},
    {top:'22%', w:110, dur:60, delay:-20},
    {top:'14%', w:90,  dur:52, delay:-8},
  ];
  cloudCfg.forEach(c=>{
    const d = document.createElement('div');
    d.className='cloud';
    d.style.top = c.top;
    d.style.animationDuration = c.dur+'s';
    d.style.animationDelay = c.delay+'s';
    d.innerHTML = cloudSVG(c.w);
    cloudsEl.appendChild(d);
  });

  // city skyline (generated buildings, duplicated for seamless loop)
  function buildSkylineSVG(seed){
    let x = 0;
    const buildings = [];
    let rng = seed;
    function rand(){ rng = (rng*9301+49297)%233280; return rng/233280; }
    const totalW = 1400, h = 220;
    while(x < totalW){
      const bw = 40 + rand()*50;
      const bh = 60 + rand()*140;
      const windows = [];
      const cols = Math.max(1, Math.floor(bw/14));
      const rows = Math.max(1, Math.floor(bh/16));
      for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
          if(rand() > 0.4){
            windows.push(`<rect x="${x+6+c*14}" y="${h-bh+8+r*16}" width="6" height="8" fill="rgba(255,210,120,0.85)"/>`);
          }
        }
      }
      buildings.push(`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="#0d0f1c"/>` + windows.join(''));
      x += bw + 4;
    }
    return `<svg viewBox="0 0 ${totalW} ${h}" preserveAspectRatio="xMinYMax meet" xmlns="http://www.w3.org/2000/svg">${buildings.join('')}</svg>`;
  }
  const cityEl = document.getElementById('city');
  cityEl.innerHTML = buildSkylineSVG(7) + buildSkylineSVG(7);

  // road lane dashes
  const laneEl = document.getElementById('lane');
  for(let i=0;i<24;i++){
    const span = document.createElement('span');
    laneEl.appendChild(span);
  }

  // ---- controls logic ----
  const body = document.body;
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedSlider = document.getElementById('speedSlider');
  const speedVal = document.getElementById('speedVal');
  const distVal = document.getElementById('distVal');
  const timeVal = document.getElementById('timeVal');
  const nightToggle = document.getElementById('nightToggle');
  const musicToggle = document.getElementById('musicToggle');
  const fullscreenToggle = document.getElementById('fullscreenToggle');

  let running = false;
  let elapsedSec = 0;
  let distanceKm = 0;
  let tickTimer = null;

  function speedToDurations(speed){
    // higher speed => shorter animation durations
    const laneDur = Math.max(0.25, 1.6 - (speed/180)*1.3);
    const cityDur = Math.max(6, 30 - (speed/180)*22);
    const bounceDur = Math.max(0.5, 1.3 - (speed/180)*0.6);
    return {laneDur, cityDur, bounceDur};
  }

  function applySpeed(){
    const speed = parseInt(speedSlider.value,10);
    speedVal.textContent = speed;
    const {laneDur, cityDur} = speedToDurations(speed);
    document.getElementById('lane').style.animationDuration = laneDur+'s';
    document.getElementById('city').style.animationDuration = cityDur+'s';
  }

  function formatTime(sec){
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    return m+':'+s;
  }

  function tick(){
    elapsedSec += 1;
    const speed = parseInt(speedSlider.value,10);
    distanceKm += speed/3600;
    timeVal.textContent = formatTime(elapsedSec);
    distVal.textContent = distanceKm.toFixed(2);
  }

  function start(){
    if(running) return;
    running = true;
    body.classList.remove('paused');
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    tickTimer = setInterval(tick, 1000);
  }
  function pause(){
    if(!running) return;
    running = false;
    body.classList.add('paused');
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    clearInterval(tickTimer);
  }
  function reset(){
    pause();
    elapsedSec = 0;
    distanceKm = 0;
    timeVal.textContent = '00:00';
    distVal.textContent = '0.00';
    startBtn.disabled = false;
    pauseBtn.disabled = true;
  }

  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', pause);
  resetBtn.addEventListener('click', reset);
  speedSlider.addEventListener('input', applySpeed);

  nightToggle.addEventListener('click', ()=>{
    body.classList.toggle('day');
    nightToggle.classList.toggle('active');
  });

  let muted = true;
  musicToggle.addEventListener('click', ()=>{
    muted = !muted;
    musicToggle.classList.toggle('active', !muted);
  });

  fullscreenToggle.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  // init
  applySpeed();
  body.classList.add('paused'); // starts paused until Start pressed
  pauseBtn.disabled = true;
</script>

</body>
</html>
